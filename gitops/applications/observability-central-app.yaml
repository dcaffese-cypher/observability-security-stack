# Merged ArgoCD Application: the former 4 Applications (prometheus, loki, victoria-metrics, otel-collector)
# are merged into this single Application. One Helm chart (observability-central) = one Application = one instantiation.
# Install alongside other app definitions in k8s-infra at the point of install.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-central
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: admin
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_OBSERVABILITY_REPO.git
    targetRevision: HEAD
    path: charts/observability-central
    helm:
      releaseName: observability-central
      version: v3
      # Infra-cluster override: mute Grafana alert *execution* so this Grafana
      # does not fire Assembly-team notifications via the shared rules.yml.
      # Grafana 12 cannot disable unified alerting (legacy alerting was removed);
      # unified_alerting.enabled=false is ignored or crashloops when alerting
      # files are mounted. execute_alerts=false keeps UA enabled but silent.
      # Also omit the grafana-alerting mount: network-nvswitch-cloud.yml
      # references receiver cloud-mission-teams which only exists as API-owned
      # contact points on Assembly Grafana.
      # grafana is a kube-prometheus-stack subchart — values must be nested.
      # The Assembly Grafana is a separate Application and is NOT affected.
      values: |
        kube-prometheus-stack:
          grafana:
            grafana.ini:
              unified_alerting:
                execute_alerts: false
            extraConfigmapMounts:
              - name: dashboards-provider
                mountPath: /etc/grafana/provisioning/dashboards/observability-dashboards.yml
                subPath: dashboards.yml
                configMap: grafana-dashboards-provider
                readOnly: true
              - name: plugins-provisioning
                mountPath: /etc/grafana/provisioning/plugins/plugins.yaml
                subPath: plugins.yaml
                configMap: grafana-plugins-provisioning
                readOnly: true
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
