# Merged ArgoCD Application: the former 4 Applications (prometheus, loki, victoria-metrics, otel-collector)
# are merged into this single Application. One Helm chart (observability-central) = one Application = one instantiation.
# Install alongside other app definitions in k8s-infra at the point of install.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-central
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: admin
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_OBSERVABILITY_REPO.git
    targetRevision: HEAD
    path: charts/observability-central
    helm:
      releaseName: observability-central
      version: v3
      # Infra-cluster override: disable Grafana unified alerting so the infra
      # Grafana does not fire Assembly-team notifications via the shared rules.yml.
      # The Assembly Grafana (grafana.observability.eodc.eu) is deployed from a
      # separate ArgoCD Application and is NOT affected by this block.
      values: |
        grafana:
          grafana.ini:
            unified_alerting:
              enabled: false
            alerting:
              enabled: false
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: true
