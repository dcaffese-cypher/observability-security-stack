# Access org (3) HDA host/nginx alerts — YOUR-TICKET Phase 3.
# File-provisioned via grafana-alerting ConfigMap (provenance=file).
# Do NOT recreate these UIDs via Grafana API/UI — that causes
# "cannot change provenance from 'api' to 'file'" and blocks Grafana startup.
apiVersion: 1
groups:
  - orgId: 3
    name: access-hda
    folder: Access Alerts
    interval: 1m
    rules:
      - uid: access-hda-cpu-high
        title: "HDA CPU high (>85%)"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          team: access
          service: hda
        annotations:
          summary: "HDA host CPU utilization is above 85%."
          description: "CPU util from system.cpu.time (team=access) exceeded 85% for 10m."
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: victoria-metrics }
              expr: '100 * (1 - sum(rate({__name__="system.cpu.time", team="access", state="idle"}[5m])) / sum(rate({__name__="system.cpu.time", team="access"}[5m])))'
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: B
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: access-hda-mem-high
        title: "HDA Memory high (>90%)"
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          team: access
          service: hda
        annotations:
          summary: "HDA host memory used is above 90%."
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: victoria-metrics }
              expr: '100 * sum({__name__="system.memory.usage", team="access", state="used"}) / sum({__name__="system.memory.usage", team="access"})'
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: B
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: access-hda-disk-high
        title: "HDA Disk / high (>90%)"
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          team: access
          service: hda
        annotations:
          summary: "HDA root filesystem usage is above 90%."
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: victoria-metrics }
              expr: '100 * sum({__name__="system.filesystem.usage", team="access", state="used", mountpoint="/"}) / sum({__name__="system.filesystem.usage", team="access", mountpoint="/"})'
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: B
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: access-hda-metrics-silence
        title: "HDA metrics silence (no nginx.requests)"
        condition: B
        for: 5m
        # Fire when series disappears (shipper/otelcol down).
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
          team: access
          service: hda
        annotations:
          summary: "No nginx.requests for team=access — otelcol may be down."
        data:
          - refId: A
            datasourceUid: victoria-metrics
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              datasource: { type: prometheus, uid: victoria-metrics }
              expr: 'max_over_time({__name__="nginx.requests", team="access"}[15m])'
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: B
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }
                  type: query
